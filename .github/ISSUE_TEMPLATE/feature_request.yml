name: Feature request
description: An idea that would make the panel more useful.
title: "Idea: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        The panel has one rule above all others: keep it simple. Easy to install, nothing to configure, nothing automatic, everything undoable. Ideas that fit that rule are the easiest to say yes to.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation, in your own words. A real example helps more than a general one.
      placeholder: I have three kinds of projects and I keep switching the same ten skills by hand…
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: What you would like to see or press.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What do you do today instead?
    validations:
      required: false
  - type: checkboxes
    id: help
    attributes:
      label: Would you like to build it?
      options:
        - label: I can open a pull request for this.
          required: false
